name: 贺众官网监控

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检查站点并推送飞书告警
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          set -uo pipefail
          SITES=(
            "官网首页|https://www.hzyinshuij.com/__test_down__"
            "产品中心|https://www.hzyinshuij.com/product.html"
            "商用饮水机|https://www.hzyinshuij.com/product-200000.html"
            "家用饮水机|https://www.hzyinshuij.com/product-200001.html"
            "滤芯及配件|https://www.hzyinshuij.com/product-200002.html"
            "客户案例|https://www.hzyinshuij.com/case.html"
            "新闻中心|https://www.hzyinshuij.com/article.html"
          )
          DOWN=""
          for item in "${SITES[@]}"; do
            name="${item%%|*}"
            url="${item#*|}"
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" 2>/dev/null || echo "000")
            if [ "$code" != "200" ]; then
              DOWN="${DOWN}${name} (${code})\n"
            fi
          done

          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')
          if [ -n "$DOWN" ]; then
            TEXT="【贺众监控告警】检测到站点异常：\n${DOWN}\n时间：${TS}"
            PAYLOAD=$(jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}')
            RESP=$(curl -s -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD")
            echo "ALERT -> ${RESP}"
          else
            echo "OK: all 7 online"
          fi
