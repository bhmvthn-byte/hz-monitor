name: 贺众官网监控

on:
  schedule:
    - cron: '*/10 * * * *'    # 常规监控（每10分钟）
    - cron: '0 16 * * *'      # 维护开始通知（UTC16:00 = 上海00:00）
    - cron: '0 22 * * *'      # 维护结束通知（UTC22:00 = 上海06:00）
  workflow_dispatch:
    inputs:
      test_mode:
        description: '测试模式'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - all_down
          - maint_test

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检查站点并推送飞书告警
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'normal' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -uo pipefail
          TS=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')

          send_feishu() {
            local PAYLOAD
            PAYLOAD=$(jq -n --arg t "$1" '{msg_type:"text",content:{text:$t}}')
            curl -s -X POST "$FEISHU_WEBHOOK" -H "Content-Type: application/json" -d "$PAYLOAD"
          }

          # —— 维护开始/结束通知（由精确 cron 触发）——
          case "$SCHEDULE" in
            "0 16 "*)
              TEXT=$(printf '%b' "【贺众监控】\n维护开始：进入每日维护时段（00:00–06:00），暂停监控与告警。\n时间：${TS}")
              echo "MAINT-START -> $(send_feishu "$TEXT")"
              exit 0
              ;;
            "0 22 "*)
              TEXT=$(printf '%b' "【贺众监控】\n维护结束：维护时段结束，监控与告警已恢复。\n时间：${TS}")
              echo "MAINT-END -> $(send_feishu "$TEXT")"
              exit 0
              ;;
          esac

          # —— 手动测试维护通知 ——
          if [ "$TEST_MODE" = "maint_test" ]; then
            TEXT=$(printf '%b' "【贺众监控】\n维护通知测试：每日维护开始（00:00）与结束（06:00）会各发一条通知。\n时间：${TS}")
            echo "MAINT-TEST -> $(send_feishu "$TEXT")"
            exit 0
          fi

          # —— 维护时段内跳过常规检测（上海 00:00–06:00）——
          H=$(TZ=Asia/Shanghai date '+%-H')
          if [ "$H" -lt 6 ]; then
            echo "MAINT: 维护时段内，跳过检测"
            exit 0
          fi

          SITES=(
            "官网首页|https://www.yinshuij.com/"
            "产品展示|https://www.yinshuij.com/products.html"
            "智能直饮机|https://www.yinshuij.com/products/intelligent-direct-drinking-machine.html"
            "程控杀菌直饮机|https://www.yinshuij.com/products/program-controlled-sterilized-direct-drinking-machine.html"
            "全数字程控开水机|https://www.yinshuij.com/products/all-digital-programmable-water-heater.html"
            "家用净水器|https://www.yinshuij.com/products/household-water-purifier.html"
            "滤芯及配件|https://www.yinshuij.com/products/filter-element-accessories.html"
            "客户案例|https://www.yinshuij.com/cases.html"
            "新闻资讯|https://www.yinshuij.com/news.html"
            "关于我们|https://www.yinshuij.com/about.html"
            "联系我们|https://www.yinshuij.com/contact.html"
          )
          DOWN=""
          SLOW=""
          if [ "$TEST_MODE" = "all_down" ]; then
            for item in "${SITES[@]}"; do
              name="${item%%|*}"
              DOWN="${DOWN}${name} (HTTP 000 · 测试模拟)\n"
            done
          else
            for item in "${SITES[@]}"; do
              name="${item%%|*}"
              url="${item#*|}"
              resp=$(curl -s -o /dev/null -w "%{http_code} %{time_total}" -L --max-time 15 "$url" 2>/dev/null)
              code=${resp%% *}
              t=${resp#* }
              if [ "$code" != "200" ] || [ -z "$code" ]; then
                DOWN="${DOWN}${name} (HTTP ${code:-000})\n"
              else
                is_slow=$(awk -v v="$t" 'BEGIN{print (v+0>10)?1:0}')
                if [ "$is_slow" = "1" ]; then
                  SLOW="${SLOW}${name} (${t}s)\n"
                fi
              fi
            done
          fi

          if [ -n "$DOWN" ] || [ -n "$SLOW" ]; then
            if [ "$TEST_MODE" = "all_down" ]; then
              TEXT="【贺众监控·例行测试】\n以下站点离线（模拟）：\n${DOWN}时间：${TS}"
            else
              TEXT="【贺众监控警告】\n"
              if [ -n "$DOWN" ]; then
                TEXT="${TEXT}以下站点离线：\n${DOWN}"
              fi
              if [ -n "$SLOW" ]; then
                TEXT="${TEXT}以下站点响应缓慢(>10s)：\n${SLOW}"
              fi
              TEXT="${TEXT}时间：${TS}"
            fi
            TEXT=$(printf '%b' "$TEXT")
            echo "ALERT -> $(send_feishu "$TEXT")"
          else
            echo "OK: all 11 online and fast"
          fi
